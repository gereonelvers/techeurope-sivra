# Organisation routing table. Maps each person/role to a contact + spending
# authority (budget). The router uses budget bands + decision ownership to pick
# the *right person*; fill `phone` numbers (E.164) to enable real Telnyx SMS.
org-acme:
  people:
    buyer:
      phone: null           # e.g. "+49170..."  (any mobile; SMS needs no opt-in)
      budget: 150
      label: "Buyer (you)"
    procurement_lead:
      phone: null
      budget: 500
      label: "Procurement lead"
    manager:
      phone: null
      budget: 5000
      label: "Manager"

  # Which person owns each decision type before any budget-based escalation.
  decision_owner:
    price_over_budget: procurement_lead
    pickup_logistics: buyer
    ambiguous_listing: buyer
    approve_purchase: procurement_lead
    safety_flag: manager
